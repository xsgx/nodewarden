name: Sync upstream
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/shuaiplus/NodeWarden.git
      
      - name: Fetch upstream
        run: git fetch upstream main
      
      - name: Merge upstream main，处理冲突并保留本地workflows
        run: |
          # 合并上游
          git merge upstream/main --allow-unrelated-histories -X theirs || true
          # 如果出现modify/delete冲突，告诉git保留本地的sync-upstream.yml
          git checkout --ours .github/workflows/sync-upstream.yml
          # 全部workflow目录以本地版本为准
          git checkout HEAD -- .github/workflows
          # 添加到暂存区
          git add .
          # 提交合并
          git commit -m "Auto sync upstream NodeWarden"
      
      - name: Push back to repo
        run: git push origin main
