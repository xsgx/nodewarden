name: Sync upstream
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Clone upstream repo into temp folder
        run: |
          git clone --depth=1 https://github.com/shuaiplus/NodeWarden.git upstream-tmp
          cd upstream-tmp
          git checkout main

      - name: Sync files (exclude root .github folder)
        run: |
          rsync -av --exclude /.github upstream-tmp/ ./
          rm -rf upstream-tmp

      - name: Git commit & push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto sync NodeWarden upstream" || echo "No file changes"
          git push origin main
