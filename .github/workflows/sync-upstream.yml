name: Sync upstream
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
      
      - name: Pull upstream repo to temp dir
        run: |
          git clone https://github.com/shuaiplus/NodeWarden.git upstream-tmp
          cd upstream-tmp
          git checkout main
      
      - name: Sync files，排除 .github 目录
        run: |
          # 同步所有业务代码，不复制 .github
          rsync -av --exclude='.github' upstream-tmp/ ./
      
      - name: Git commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto sync NodeWarden upstream" || echo "No changes"
          git push origin main
