name: Sync upstream
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Add upstream remote
        run: git remote add upstream https://github.com/shuaiplus/NodeWarden.git
      
      - name: Fetch upstream
        run: git fetch upstream main
      
      - name: Merge upstream main，保留本地.github/workflows
        run: |
          git merge upstream/main --allow-unrelated-histories -X theirs
          # 丢弃上游 .github/workflows 的变更，保护你当前的工作流文件
          git checkout HEAD -- .github/workflows
      
      - name: Push back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git push origin main
