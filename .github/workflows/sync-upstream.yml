name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * *'        # 每天 UTC 03:00 自动同步
  workflow_dispatch:             # 也支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync fork with upstream
        run: gh repo sync ${{ github.repository }} -b main --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
